<section class="hero-slider-section">

  <div class="hero-slider" id="heroSlider">

    <!-- Slider Track -->
    <div class="hero-slider-track">

      <!-- Slide 1 -->
      <div class="hero-slide is-active">
        <img src="images/ad1.png" alt="Big Bachat Days - Levi's & US Polo Assn 50-70% Off" loading="eager"
          onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1600&auto=format&fit=crop&q=80';" />
      </div>

      <!-- Slide 2 -->
      <div class="hero-slide">
        <img src="images/ad2.png" alt="Big Bachat Days - Puma & Reebok Sports Shoes Min 65% Off" loading="lazy"
          onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1600&auto=format&fit=crop&q=80';" />
      </div>

      <!-- Slide 3 -->
      <div class="hero-slide">
        <img src="images/ad3.png" alt="Festivals of India - Starts from 99" loading="lazy"
          onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=1600&auto=format&fit=crop&q=80';" />
      </div>

      <!-- Slide 4 -->
      <div class="hero-slide">
        <img src="images/ad4.png" alt="Big Bachat Days - Nike Sports Shoes Min 65% Off" loading="lazy"
          onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1600&auto=format&fit=crop&q=80';" />
      </div>

      <!-- Slide 5 -->
      <div class="hero-slide">
        <img src="images/ad1.png" alt="Big Bachat Days - Audio & Accessories" loading="lazy"
          onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1600&auto=format&fit=crop&q=80';" />
      </div>

    </div>


    <!-- Slider Controls -->

    <button class="slider-btn slider-btn--prev" id="slidePrev" type="button" aria-label="Previous Slide">
      ‹
    </button>

    <button class="slider-btn slider-btn--next" id="slideNext" type="button" aria-label="Next Slide">
      ›
    </button>


    <!-- Slider Dots -->

    <div class="slider-dots" id="sliderDots">

      <button class="slider-dot is-active" data-index="0" aria-label="Slide 1"></button>

      <button class="slider-dot" data-index="1" aria-label="Slide 2"></button>

      <button class="slider-dot" data-index="2" aria-label="Slide 3"></button>

      <button class="slider-dot" data-index="3" aria-label="Slide 4"></button>

      <button class="slider-dot" data-index="4" aria-label="Slide 5"></button>

    </div>

  </div>

</section>
