<section class="hero-slider-section">

  <div class="hero-slider" id="heroSlider">

    <!-- Slider Track -->
    <div class="hero-slider-track">

      <!-- Slide 1 -->
      <div class="hero-slide is-active">
        <img
          src="https://rukminim2.flixcart.com/fk-p-flap/1600/350/image/0d5b3b7d6bf2b4d8.jpg?q=90"
          alt="Big Bachat Days - Levi's & US Polo Assn 50-70% Off"
          loading="eager"
        />
      </div>

      <!-- Slide 2 -->
      <div class="hero-slide">
        <img
          src="https://rukminim2.flixcart.com/fk-p-flap/1600/350/image/06f7d847d65d3db8.jpg?q=90"
          alt="Big Bachat Days - Puma & Reebok Sports Shoes Min 65% Off"
          loading="lazy"
        />
      </div>

      <!-- Slide 3 -->
      <div class="hero-slide">
        <img
          src="https://rukminim2.flixcart.com/fk-p-flap/1600/350/image/8ca9cd5c9d346f9a.jpg?q=90"
          alt="Festivals of India - Starts from 99"
          loading="lazy"
        />
      </div>

      <!-- Slide 4 -->
      <div class="hero-slide">
        <img
          src="https://rukminim2.flixcart.com/fk-p-flap/1600/350/image/b20a3d4d3d9ec4f2.jpg?q=90"
          alt="Big Bachat Days - Nike Sports Shoes Min 65% Off"
          loading="lazy"
        />
      </div>

      <!-- Slide 5 -->
      <div class="hero-slide">
        <img
          src="https://rukminim2.flixcart.com/fk-p-flap/1600/350/image/8e8a6d86d3a3a1d4.jpg?q=90"
          alt="Big Bachat Days - Action Figure Min 65% Off"
          loading="lazy"
        />
      </div>

    </div>


    <!-- Slider Controls -->

    <button
      class="slider-btn slider-btn--prev"
      id="slidePrev"
      type="button"
      aria-label="Previous Slide"
    >
      ‹
    </button>

    <button
      class="slider-btn slider-btn--next"
      id="slideNext"
      type="button"
      aria-label="Next Slide"
    >
      ›
    </button>


    <!-- Slider Dots -->

    <div class="slider-dots" id="sliderDots">

      <button
        class="slider-dot is-active"
        data-index="0"
        aria-label="Slide 1"
      ></button>

      <button
        class="slider-dot"
        data-index="1"
        aria-label="Slide 2"
      ></button>

      <button
        class="slider-dot"
        data-index="2"
        aria-label="Slide 3"
      ></button>

      <button
        class="slider-dot"
        data-index="3"
        aria-label="Slide 4"
      ></button>

      <button
        class="slider-dot"
        data-index="4"
        aria-label="Slide 5"
      ></button>

    </div>

  </div>

</section>
